<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Multiple GLB Viewer</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    body {
      margin: 0;
      display: flex;
      flex-direction: row;
      height: 100vh;
    }
    model-viewer {
      flex: 1;
      height: 100%;
      background-color: #f0f0f0;
    }
  </style>
</head>
<body>

  <!-- First model -->
  <model-viewer 
    src="planet_x_frame.glb" 
    alt="Planet X Frame" 
    auto-rotate 
    camera-controls>
  </model-viewer>

  <!-- Second model -->
  <model-viewer 
    src="bxt_frame.glb" 
    alt="bxt frame" 
    auto-rotate 
    camera-controls>
  </model-viewer>

</body>
</html>

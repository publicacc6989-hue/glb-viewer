<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Planet X + BXT Viewer</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <script type="module" src="https://unpkg.com/three@0.152.2/build/three.module.js"></script>
  <script type="module" src="https://unpkg.com/three@0.152.2/examples/jsm/loaders/GLTFLoader.js"></script>
  <style>
    body { margin: 0; }
    model-viewer { width: 100vw; height: 100vh; background-color: #f0f0f0; }
  </style>
</head>
<body>

<model-viewer 
  id="viewer"
  src="planet_x_frame.glb"
  alt="Planet X + BXT"
  auto-rotate
  camera-controls
  shadow-intensity="1">
</model-viewer>

<script type="module">
  const viewer = document.getElementById('viewer');
  const loader = new window.THREE.GLTFLoader();

  viewer.addEventListener('load', () => {
    const scene = viewer.scene; // access internal three.js scene

    // Load BXT frame
    loader.load('bxt_frame.glb', (gltf) => {
      const model = gltf.scene;

      // Move it to the right so it doesn't overlap
      model.position.set(2, 0, 0);

      scene.add(model);
      console.log("✅ BXT added to scene");
    }, undefined, (err) => {
      console.error("❌ Failed to load BXT:", err);
    });
  });
</script>

</body>
</html>

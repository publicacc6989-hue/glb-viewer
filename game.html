<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Planet X Frame Viewer</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    body { margin: 0; }
    model-viewer { width: 100vw; height: 100vh; background-color: #f0f0f0; }
  </style>
</head>
<body>

<model-viewer 
    src="planet_x_frame.glb" 
    alt="Planet X Frame" 
    auto-rotate 
    camera-controls 
    background-color="#ffffff">
</model-viewer>

</body>
</html>
